<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/favicon.png" />

        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>SrBananaMan</title>

        <meta name="description" content="Projects and Nintendo 64 recompilations by SrBananaMan." />

        <style>
            :root {
                --background: #090b12;
                --background-secondary: #111522;
                --card: rgba(24, 29, 45, 0.82);
                --text: #ffffff;
                --text-secondary: #aeb6cc;
                --accent: #75d66f;
                --accent-hover: #93eb8e;
                --border: rgba(255, 255, 255, 0.1);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                min-height: 100vh;

                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;

                color: var(--text);

                background: radial-gradient(circle at top, rgba(65, 130, 75, 0.22), transparent 38%), var(--background);
            }

            a {
                color: inherit;
                text-decoration: none;
            }

            .page {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            header {
                width: min(1100px, calc(100% - 40px));
                margin: 0 auto;
                padding: 28px 0;

                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .logo {
                font-size: 1.2rem;
                font-weight: 800;
                letter-spacing: 0.03em;
            }

            .nav-link {
                color: var(--text-secondary);
                font-weight: 600;

                transition: color 0.2s ease;
            }

            .nav-link:hover {
                color: var(--text);
            }

            main {
                flex: 1;
            }

            .hero {
                width: min(900px, calc(100% - 40px));

                min-height: 52vh;

                margin: 0 auto;

                padding: 55px 0 20px;

                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;

                text-align: center;
            }

            h1 {
                max-width: 800px;

                font-size: clamp(3rem, 9vw, 6.5rem);

                line-height: 0.95;

                letter-spacing: -0.06em;
            }

            .tagline {
                margin-top: 18px;

                color: var(--accent);

                font-size: 1rem;
                font-weight: 700;

                letter-spacing: 0.08em;

                transform: translateY(8px);
            }

            .hero-description {
                max-width: 650px;

                margin-top: 26px;

                color: var(--text-secondary);

                font-size: clamp(1rem, 2vw, 1.2rem);

                line-height: 1.7;
            }

            .main-button {
                display: inline-flex;
                justify-content: center;
                align-items: center;

                min-width: 210px;

                margin-top: 38px;

                padding: 17px 34px;

                border: 1px solid rgba(255, 255, 255, 0.16);

                border-radius: 999px;

                color: #081008;

                background: var(--accent);

                box-shadow: 0 15px 45px rgba(76, 190, 83, 0.25);

                font-size: 1.1rem;
                font-weight: 900;

                transition:
                    transform 0.2s ease,
                    background 0.2s ease,
                    box-shadow 0.2s ease;
            }

            .main-button:hover {
                transform: translateY(-3px);

                background: var(--accent-hover);

                box-shadow: 0 20px 55px rgba(76, 190, 83, 0.38);
            }

            .projects {
                width: min(1000px, calc(100% - 40px));

                margin: 0 auto;

                padding: 25px 0 120px;
            }

            .section-heading {
                margin-bottom: 28px;
                text-align: center;
            }

            .section-heading h2 {
                font-size: clamp(2rem, 5vw, 3.2rem);

                letter-spacing: -0.04em;
            }

            .section-heading p {
                margin-top: 10px;

                color: var(--text-secondary);
            }

            #recomp-list {
                display: flex;
                flex-direction: column;
                gap: 28px;
            }

            .loading-projects {
                color: var(--text-secondary);
                text-align: center;
            }

            .project-card {
                padding: clamp(28px, 5vw, 52px);

                border: 1px solid var(--border);

                border-radius: 26px;

                background: linear-gradient(135deg, rgba(94, 175, 91, 0.12), transparent 50%), var(--card);

                box-shadow: 0 30px 70px rgba(0, 0, 0, 0.28);

                backdrop-filter: blur(14px);
            }

            .project-header {
                display: flex;

                align-items: center;

                gap: 18px;
            }

            .project-icon {
                width: 72px;
                height: 72px;

                flex-shrink: 0;

                border: 1px solid var(--border);

                border-radius: 16px;

                object-fit: cover;

                background: rgba(255, 255, 255, 0.06);
            }

            .project-title-area {
                min-width: 0;
            }

            .project-label {
                color: var(--accent);

                font-size: 0.82rem;
                font-weight: 800;

                letter-spacing: 0.12em;

                text-transform: uppercase;
            }

            .project-title-area h3 {
                margin-top: 6px;

                font-size: clamp(2rem, 6vw, 3.8rem);

                letter-spacing: -0.05em;
            }

            .project-card p {
                max-width: 720px;

                margin-top: 18px;

                color: var(--text-secondary);

                font-size: 1.05rem;

                line-height: 1.7;
            }

            .project-actions {
                display: flex;

                flex-wrap: wrap;

                gap: 14px;

                margin-top: 30px;
            }

            .project-link {
                display: inline-flex;

                justify-content: center;
                align-items: center;

                padding: 13px 21px;

                border: 1px solid var(--border);

                border-radius: 12px;

                background: rgba(255, 255, 255, 0.06);

                font-weight: 700;

                cursor: pointer;

                transition:
                    transform 0.2s ease,
                    background 0.2s ease;
            }

            .project-link:hover {
                transform: translateY(-2px);

                background: rgba(255, 255, 255, 0.11);
            }

            .download-link {
                color: #081008;

                background: var(--accent);

                border-color: transparent;
            }

            .download-link:hover {
                background: var(--accent-hover);
            }

            .download-count {
                margin-top: 28px;

                padding-top: 20px;

                border-top: 1px solid var(--border);

                color: var(--text-secondary);

                font-size: 0.9rem;
                font-weight: 600;

                display: flex;

                align-items: center;

                gap: 8px;
            }

            .project-error {
                padding: 25px;

                border: 1px solid var(--border);

                border-radius: 16px;

                color: var(--text-secondary);

                background: rgba(255, 255, 255, 0.04);
            }

            footer {
                border-top: 1px solid var(--border);

                background: rgba(0, 0, 0, 0.18);
            }

            .footer-content {
                width: min(1000px, calc(100% - 40px));

                margin: 0 auto;

                padding: 34px 0;

                display: flex;

                justify-content: space-between;
                align-items: center;

                gap: 24px;
            }

            .footer-text {
                color: var(--text-secondary);

                font-size: 0.92rem;
            }

            .social-links {
                display: flex;

                gap: 12px;
            }

            .social-link {
                padding: 10px 16px;

                border: 1px solid var(--border);

                border-radius: 10px;

                color: var(--text-secondary);

                font-weight: 700;

                transition:
                    color 0.2s ease,
                    background 0.2s ease;
            }

            .social-link:hover {
                color: var(--text);

                background: rgba(255, 255, 255, 0.07);
            }

            .social-icon-link {
                width: 44px;
                height: 44px;
                padding: 0;

                display: inline-flex;
                justify-content: center;
                align-items: center;

                border-radius: 12px;
            }

            .social-icon-link svg {
                width: 22px;
                height: 22px;
            }

            @media (max-width: 650px) {
                header {
                    padding-top: 22px;
                }

                .hero {
                    min-height: 48vh;

                    padding: 45px 0 15px;
                }

                .projects {
                    padding-top: 20px;
                    padding-bottom: 80px;
                }

                .project-header {
                    align-items: flex-start;
                }

                .project-icon {
                    width: 58px;
                    height: 58px;

                    border-radius: 13px;
                }

                .project-actions {
                    flex-direction: column;
                }

                .project-link {
                    width: 100%;
                }

                .footer-content {
                    flex-direction: column;

                    text-align: center;
                }

                .social-links {
                    flex-wrap: wrap;

                    justify-content: center;
                }
            }
        </style>
    </head>

    <body>
        <div class="page">
        <header>
            <a class="logo" href="/">
                SrBananaMan
            </a>
        
            <nav class="nav-links">
                <a class="nav-link" href="#recomps">
                    Projects
                </a>
        
                <a class="nav-link" href="/tools/">
                    Tools
                </a>
            </nav>
        </header>

            <main>
                <section class="hero">
                    <h1>SrBananaMan</h1>

                    <p class="tagline">Developer · Gamer · Modder</p>

                    <p class="hero-description">See my cool stuff here. Not much to look at yet.</p>

                    <a class="main-button" href="#recomps"> Recomps </a>
                </section>

                <section class="projects" id="recomps">
                    <div class="section-heading">
                        <h2>Recomps</h2>

                        <p>Native recompilations of N64 games.</p>
                    </div>

                    <div id="recomp-list">
                        <p class="loading-projects">Loading projects...</p>
                    </div>
                </section>
            </main>

            <footer>
                <div class="footer-content">
                    <p class="footer-text">© 2026 SrBananaMan</p>

                    <div class="social-links">
                        <a
                            class="social-link social-icon-link"
                            href="https://github.com/SrBananaMan"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="GitHub"
                            title="GitHub"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    fill="currentColor"
                                    d="M12 .7C5.7.7.7 5.8.7 12.1c0 5 3.3 9.3 7.9 10.8.6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3 0 0 1-.3 3.2 1.2A11.3 11.3 0 0 1 12 5.8c1 0 2 .1 2.9.4 2.2-1.5 3.2-1.2 3.2-1.2.6 1.5.2 2.7.1 3 .8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.8C23.3 5.8 18.3.7 12 .7Z"
                                />
                            </svg>
                        </a>

                        <a
                            class="social-link social-icon-link"
                            href="https://www.youtube.com/@SrBananaMan64"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="YouTube"
                            title="YouTube"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    fill="currentColor"
                                    d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"
                                />
                            </svg>
                        </a>
                    </div>
                </div>
            </footer>
        </div>

        <script>
            const recompProjects = [
                {
                    github: "https://github.com/HarvestMoon64Recomp/HarvestMoon64Recomp",
                    title: "Harvest Moon 64 Recompiled",
                    featured: true,
                    downloads: true,
                    downloadButton: true,
                },
            ];

            function parseGitHubUrl(url) {
                const parsed = new URL(url);

                const parts = parsed.pathname.split("/").filter(Boolean);

                if (parts.length < 2) {
                    throw new Error(`Invalid GitHub repository URL: ${url}`);
                }

                return {
                    owner: parts[0],
                    repo: parts[1],
                };
            }

            async function fetchRepository(project) {
                const { owner, repo } = parseGitHubUrl(project.github);

                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}`);

                if (!response.ok) {
                    throw new Error(`Repository request failed: ${response.status}`);
                }

                return await response.json();
            }

            async function fetchReleases(project) {
                const { owner, repo } = parseGitHubUrl(project.github);

                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/releases?per_page=100`);

                if (!response.ok) {
                    throw new Error(`Release request failed: ${response.status}`);
                }

                return await response.json();
            }

            function detectPlatform() {
                const userAgent = navigator.userAgent.toLowerCase();

                const platform = (navigator.userAgentData?.platform || navigator.platform || "").toLowerCase();

                const isWindows = platform.includes("win") || userAgent.includes("windows");

                const isMacOS =
                    platform.includes("mac") || userAgent.includes("macintosh") || userAgent.includes("mac os");

                const isLinux = platform.includes("linux") || userAgent.includes("linux");

                const isArm64 =
                    platform.includes("arm") ||
                    platform.includes("aarch64") ||
                    userAgent.includes("arm64") ||
                    userAgent.includes("aarch64");

                if (isWindows) {
                    return {
                        key: "windows",
                        label: "Windows",
                    };
                }

                if (isMacOS) {
                    return {
                        key: "macos",
                        label: "macOS",
                    };
                }

                if (isLinux && isArm64) {
                    return {
                        key: "linux-arm64",
                        label: "Linux ARM64",
                    };
                }

                if (isLinux) {
                    return {
                        key: "linux",
                        label: "Linux",
                    };
                }

                return {
                    key: "unknown",
                    label: "your platform",
                };
            }

            function findPlatformAsset(releases) {
                if (!releases || releases.length === 0) {
                    return null;
                }

                const latestRelease = releases[0];

                const detected = detectPlatform();

                const assets = latestRelease.assets || [];

                function matches(asset) {
                    const name = asset.name.toLowerCase();

                    if (detected.key === "windows") {
                        return name.includes("windows") && name.endsWith(".zip");
                    }

                    if (detected.key === "macos") {
                        return (name.includes("macos") || name.includes("mac")) && name.endsWith(".zip");
                    }

                    if (detected.key === "linux-arm64") {
                        return (
                            name.includes("linux") &&
                            (name.includes("arm64") || name.includes("aarch64")) &&
                            name.endsWith(".zip")
                        );
                    }

                    if (detected.key === "linux") {
                        return (
                            name.includes("linux") &&
                            !name.includes("arm64") &&
                            !name.includes("aarch64") &&
                            name.endsWith(".zip")
                        );
                    }

                    return false;
                }

                return assets.find(matches) || null;
            }

            function calculateDownloads(releases) {
                let total = 0;

                for (const release of releases) {
                    for (const asset of release.assets || []) {
                        total += asset.download_count || 0;
                    }
                }

                return total;
            }

            async function createProjectCard(project) {
                const repo = await fetchRepository(project);

                let releases = [];

                if (project.downloads || project.downloadButton) {
                    try {
                        releases = await fetchReleases(project);
                    } catch (error) {
                        console.error("Unable to load releases:", error);
                    }
                }

                const title = project.title || repo.name;

                const description = repo.description || "No description available.";

                const icon = project.icon || repo.owner.avatar_url;

                const githubUrl = repo.html_url;

                const label = project.featured ? "Featured Project" : "Recomp";

                let downloadButtonHtml = "";

                if (project.downloadButton) {
                    const detected = detectPlatform();

                    const asset = findPlatformAsset(releases);

                    if (asset) {
                        downloadButtonHtml = `
                        <a
                            class="project-link download-link"
                            href="${asset.browser_download_url}"
                        >
                            Download for ${detected.label}
                        </a>
                    `;
                    } else {
                        downloadButtonHtml = `
                        <a
                            class="project-link download-link"
                            href="${githubUrl}/releases/latest"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Choose Download
                        </a>
                    `;
                    }
                }

                let downloadCountHtml = "";

                if (project.downloads) {
                    const totalDownloads = calculateDownloads(releases);

                    downloadCountHtml = `
                    <div class="download-count">
                        <span>↓</span>

                        <span>
                            ${totalDownloads.toLocaleString()}
                            downloads
                        </span>
                    </div>
                `;
                }

                const article = document.createElement("article");

                article.className = "project-card";

                article.innerHTML = `
                <div class="project-header">

                    <img
                        class="project-icon"
                        src="${icon}"
                        alt="${title}"
                        loading="lazy"
                    >

                    <div class="project-title-area">

                        <span class="project-label">
                            ${label}
                        </span>

                        <h3>
                            ${title}
                        </h3>

                    </div>

                </div>


                <p>
                    ${description}
                </p>


                <div class="project-actions">

                    <a
                        class="project-link"
                        href="${githubUrl}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        View on GitHub
                    </a>

                    ${downloadButtonHtml}

                </div>


                ${downloadCountHtml}
            `;

                return article;
            }

            async function loadProjects() {
                const list = document.getElementById("recomp-list");

                list.innerHTML = "";

                for (const project of recompProjects) {
                    try {
                        const card = await createProjectCard(project);

                        list.appendChild(card);
                    } catch (error) {
                        console.error(error);

                        const errorCard = document.createElement("div");

                        errorCard.className = "project-error";

                        errorCard.textContent = `Unable to load ${project.github}`;

                        list.appendChild(errorCard);
                    }
                }
            }

            loadProjects();
        </script>
    </body>
</html>
