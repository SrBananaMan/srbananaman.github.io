<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Is It AI? - SrBananaMan</title>

        <meta name="description" content="Check whether a GitHub project has been confirmed as vibecoded." />

        <meta property="og:title" content="Is It AI?" />

        <meta property="og:description" content="Check whether a GitHub project has been confirmed as vibecoded." />

        <meta property="og:type" content="website" />

        <link rel="icon" type="image/png" href="/favicon.png" />

        <link rel="apple-touch-icon" href="/favicon.png" />

        <style>
            :root {
                --background: #090b12;
                --card: rgba(24, 29, 45, 0.82);

                --text: #ffffff;
                --text-secondary: #aeb6cc;

                --accent: #75d66f;
                --accent-hover: #93eb8e;

                --border: rgba(255, 255, 255, 0.1);

                --yes: #ff8181;
                --no: #75d66f;
                --unknown: #e8c66a;
                --error: #ff8080;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                min-height: 100vh;

                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;

                color: var(--text);

                background: radial-gradient(circle at top, rgba(65, 130, 75, 0.22), transparent 38%), var(--background);
            }

            body.modal-open {
                overflow: hidden;
            }

            a {
                color: inherit;
                text-decoration: none;
            }

            button,
            input,
            textarea {
                font: inherit;
            }

            header {
                width: min(1100px, calc(100% - 40px));

                margin: 0 auto;
                padding: 28px 0;

                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .logo {
                font-size: 1.2rem;
                font-weight: 800;
                letter-spacing: 0.03em;
            }

            .nav-links {
                display: flex;
                align-items: center;
                gap: 24px;
            }

            .nav-link {
                color: var(--text-secondary);
                font-weight: 600;

                transition: color 0.2s ease;
            }

            .nav-link:hover {
                color: var(--text);
            }

            main {
                width: min(800px, calc(100% - 40px));

                margin: 0 auto;
                padding: 80px 0 140px;
            }

            .page-heading {
                margin-bottom: 40px;

                text-align: center;
            }

            .page-heading h1 {
                font-size: clamp(3rem, 9vw, 6rem);
                letter-spacing: -0.06em;
            }

            .page-heading p {
                max-width: 620px;

                margin: 16px auto 0;

                color: var(--text-secondary);

                line-height: 1.7;
            }

            .checker-card {
                padding: clamp(28px, 5vw, 48px);

                border: 1px solid var(--border);
                border-radius: 26px;

                background: linear-gradient(135deg, rgba(94, 175, 91, 0.12), transparent 50%), var(--card);

                box-shadow: 0 30px 70px rgba(0, 0, 0, 0.28);
            }

            .input-row {
                display: flex;
                gap: 12px;
            }

            .url-input {
                flex: 1;
                min-width: 0;

                padding: 15px 17px;

                border: 1px solid var(--border);
                border-radius: 12px;

                outline: none;

                color: var(--text);

                background: rgba(255, 255, 255, 0.055);

                transition:
                    border-color 0.2s ease,
                    background 0.2s ease;
            }

            .url-input:focus {
                border-color: var(--accent);

                background: rgba(255, 255, 255, 0.075);
            }

            .check-button {
                padding: 15px 23px;

                border: 0;
                border-radius: 12px;

                color: #081008;

                background: var(--accent);

                font-weight: 900;

                cursor: pointer;

                transition:
                    background 0.2s ease,
                    transform 0.2s ease;
            }

            .check-button:hover {
                background: var(--accent-hover);

                transform: translateY(-2px);
            }

            .check-button:disabled {
                opacity: 0.6;

                cursor: wait;

                transform: none;
            }

            .status {
                min-height: 22px;

                margin-top: 15px;

                color: var(--text-secondary);

                text-align: center;

                font-size: 0.9rem;
            }

            .status.error {
                color: var(--error);
            }

            .result {
                display: none;

                margin-top: 28px;
                padding: 32px 24px;

                border: 1px solid var(--border);
                border-radius: 18px;

                text-align: center;

                background: rgba(0, 0, 0, 0.16);
            }

            .result.visible {
                display: block;
            }

            .result-answer {
                font-size: clamp(1.8rem, 5vw, 3rem);

                font-weight: 900;

                letter-spacing: -0.04em;
            }

            .result.yes .result-answer {
                color: var(--yes);
            }

            .result.no .result-answer {
                color: var(--no);
            }

            .result.unknown .result-answer {
                color: var(--unknown);
            }

            .result-reason {
                max-width: 580px;

                margin: 12px auto 0;

                color: var(--text-secondary);

                line-height: 1.6;
            }

            .checked-url {
                margin-top: 16px;

                color: var(--text-secondary);

                font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

                font-size: 0.8rem;

                overflow-wrap: anywhere;
            }

            .result-actions {
                display: none;

                margin-top: 20px;

                justify-content: center;
                flex-wrap: wrap;
                gap: 10px;
            }

            .result-actions.visible {
                display: flex;
            }

            .share-button,
            .report-button {
                padding: 11px 18px;

                border: 1px solid var(--border);
                border-radius: 10px;

                color: var(--text);

                background: rgba(255, 255, 255, 0.06);

                font-weight: 700;

                cursor: pointer;

                transition:
                    background 0.2s ease,
                    transform 0.2s ease;
            }

            .share-button:hover,
            .report-button:hover {
                background: rgba(255, 255, 255, 0.11);

                transform: translateY(-2px);
            }

            .report-button {
                color: var(--text-secondary);
            }

            .review-form {
                display: none;

                max-width: 520px;

                margin: 26px auto 0;
                padding-top: 24px;

                border-top: 1px solid var(--border);

                text-align: left;
            }

            .review-form.visible {
                display: block;
            }

            .review-heading {
                margin-bottom: 14px;

                text-align: center;

                font-size: 1rem;
                font-weight: 800;
            }

            .field-group {
                margin-bottom: 14px;
            }

            .field-group label {
                display: block;

                margin-bottom: 8px;

                color: var(--text-secondary);

                font-size: 0.9rem;
                font-weight: 700;
            }

            .text-input,
            .form-textarea {
                width: 100%;

                padding: 14px 16px;

                border: 1px solid var(--border);
                border-radius: 11px;

                outline: none;

                color: var(--text);

                background: rgba(255, 255, 255, 0.055);

                line-height: 1.5;

                transition:
                    border-color 0.2s ease,
                    background 0.2s ease;
            }

            .form-textarea {
                min-height: 110px;

                resize: vertical;
            }

            .text-input:focus,
            .form-textarea:focus {
                border-color: var(--accent);

                background: rgba(255, 255, 255, 0.075);
            }

            .request-review-button,
            .submit-report-button {
                width: 100%;

                margin-top: 2px;
                padding: 13px 20px;

                border: 0;
                border-radius: 11px;

                color: #081008;

                background: var(--accent);

                font-weight: 800;

                cursor: pointer;

                transition:
                    background 0.2s ease,
                    transform 0.2s ease;
            }

            .request-review-button:hover,
            .submit-report-button:hover {
                background: var(--accent-hover);

                transform: translateY(-2px);
            }

            .request-review-button:disabled,
            .submit-report-button:disabled {
                opacity: 0.6;

                cursor: wait;

                transform: none;
            }

            .review-status,
            .report-status {
                min-height: 22px;

                margin-top: 12px;

                color: var(--text-secondary);

                text-align: center;

                font-size: 0.86rem;
            }

            .review-status.success,
            .report-status.success {
                color: var(--accent);
            }

            .review-status.error,
            .report-status.error {
                color: var(--error);
            }

            .modal-overlay {
                display: none;

                position: fixed;
                inset: 0;

                z-index: 1000;

                padding: 20px;

                align-items: center;
                justify-content: center;

                background: rgba(3, 5, 10, 0.8);

                backdrop-filter: blur(8px);
            }

            .modal-overlay.visible {
                display: flex;
            }

            .modal {
                width: min(540px, 100%);

                max-height: calc(100vh - 40px);

                overflow-y: auto;

                padding: 30px;

                border: 1px solid var(--border);
                border-radius: 22px;

                background: #141824;

                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
            }

            .modal-header {
                display: flex;

                justify-content: space-between;
                align-items: flex-start;

                gap: 20px;

                margin-bottom: 22px;
            }

            .modal-title {
                font-size: 1.5rem;
                font-weight: 900;
            }

            .modal-description {
                margin-top: 6px;

                color: var(--text-secondary);

                font-size: 0.9rem;
                line-height: 1.5;
            }

            .modal-close {
                width: 38px;
                height: 38px;

                flex-shrink: 0;

                border: 1px solid var(--border);
                border-radius: 10px;

                color: var(--text-secondary);

                background: rgba(255, 255, 255, 0.05);

                font-size: 1.3rem;

                cursor: pointer;
            }

            .modal-close:hover {
                color: var(--text);

                background: rgba(255, 255, 255, 0.1);
            }

            .report-project {
                margin-bottom: 20px;
                padding: 12px 14px;

                border: 1px solid var(--border);
                border-radius: 10px;

                color: var(--text-secondary);

                background: rgba(255, 255, 255, 0.035);

                font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

                font-size: 0.8rem;

                overflow-wrap: anywhere;
            }

            .classification-details {
                display: none;
                max-width: 620px;
                margin: 20px auto 0;
                text-align: left;
            }

            .classification-details.visible {
                display: block;
            }

            .classification-details ul {
                margin: 0;
                padding-left: 22px;
                color: var(--text-secondary);
                line-height: 1.65;
            }

            .classification-details li + li {
                margin-top: 6px;
            }

            .more-info-button {
                display: none;
                margin: 16px auto 0;
                padding: 9px 14px;
                border: 0;
                background: transparent;
                color: var(--accent);
                font-weight: 800;
                cursor: pointer;
            }

            .more-info-button.visible {
                display: inline-block;
            }

            .more-info-button:hover {
                text-decoration: underline;
            }

            .info-state {
                display: inline-flex;
                margin: 0 0 18px;
                padding: 6px 10px;
                border: 1px solid var(--border);
                border-radius: 999px;
                color: var(--text-secondary);
                background: rgba(255, 255, 255, 0.04);
                font-size: 0.82rem;
                font-weight: 800;
            }

            .info-full {
                color: var(--text-secondary);
                line-height: 1.75;
                white-space: pre-wrap;
            }

            footer {
                border-top: 1px solid var(--border);

                background: rgba(0, 0, 0, 0.18);
            }

            .footer-content {
                width: min(1000px, calc(100% - 40px));

                margin: 0 auto;
                padding: 34px 0;

                color: var(--text-secondary);

                text-align: center;

                font-size: 0.92rem;
            }

            @media (max-width: 650px) {
                main {
                    padding-top: 50px;
                }

                .input-row {
                    flex-direction: column;
                }

                .check-button {
                    width: 100%;
                }

                .result-actions {
                    flex-direction: column;
                }

                .share-button,
                .report-button {
                    width: 100%;
                }

                .modal {
                    padding: 22px;
                }
            }
        </style>
    </head>

    <body>
        <header>
            <a class="logo" href="/"> SrBananaMan </a>

            <nav class="nav-links">
                <a class="nav-link" href="/"> Home </a>

                <a class="nav-link" href="/tools/"> Tools </a>

        <main>

        <script>
            const urlInput = document.getElementById("url-input");

            const checkButton = document.getElementById("check-button");

            const status = document.getElementById("status");

            const result = document.getElementById("result");

            const resultAnswer = document.getElementById("result-answer");

            const resultReason = document.getElementById("result-reason");

            const checkedUrl = document.getElementById("checked-url");

            const classificationDetails = document.getElementById("classification-details");
            const classificationShortList = document.getElementById("classification-short-list");
            const moreInfoButton = document.getElementById("more-info-button");

            const infoModal = document.getElementById("info-modal");
            const infoModalClose = document.getElementById("info-modal-close");
            const infoModalTitle = document.getElementById("info-modal-title");
            const infoModalDescription = document.getElementById("info-modal-description");
            const infoState = document.getElementById("info-state");
            const infoFull = document.getElementById("info-full");

            const resultActions = document.getElementById("result-actions");

            const shareButton = document.getElementById("share-button");

            const reportButton = document.getElementById("report-button");

            const reviewForm = document.getElementById("review-form");

            const reviewProject = document.getElementById("review-project");

            const reviewUsername = document.getElementById("review-username");

            const reviewReason = document.getElementById("review-reason");

            const requestReviewButton = document.getElementById("request-review-button");

            const reviewStatus = document.getElementById("review-status");

            const reportModal = document.getElementById("report-modal");

            const modalClose = document.getElementById("modal-close");

            const reportModalTitle = document.getElementById("report-modal-title");

            const reportModalDescription = document.getElementById("report-modal-description");

            const reportProjectDisplay = document.getElementById("report-project-display");

            const reportForm = document.getElementById("report-form");

            const reportProject = document.getElementById("report-project");

            const reportCurrent = document.getElementById("report-current");

            const reportRequested = document.getElementById("report-requested");

            const reportUsername = document.getElementById("report-username");

            const reportReason = document.getElementById("report-reason");

            const submitReportButton = document.getElementById("submit-report-button");

            const reportStatus = document.getElementById("report-status");

            let currentShareUrl = "";

            let currentResultType = null;

            let currentProjectUrl = "";

            let currentClassificationInfo = null;

            function normalizeUrl(value) {
                try {
                    const url = new URL(value.trim());

                    url.search = "";

                    url.hash = "";

                    let normalized = url.toString();

                    while (normalized.endsWith("/")) {
                        normalized = normalized.slice(0, -1);
                    }

                    if (url.hostname.toLowerCase() === "github.com") {
                        normalized = normalized.toLowerCase();
                    }

                    return normalized;
                } catch {
                    return null;
                }
            }

            function getGitHubRepository(value) {
                try {
                    const url = new URL(value);

                    if (url.hostname.toLowerCase() !== "github.com") {
                        return null;
                    }

                    const parts = url.pathname.split("/").filter(Boolean);

                    if (parts.length < 2) {
                        return null;
                    }

                    return {
                        owner: parts[0],

                        repo: parts[1].replace(/\.git$/i, ""),
                    };
                } catch {
                    return null;
                }
            }

            function getRepositoryUrl(github) {
                if (!github) {
                    return null;
                }

                return normalizeUrl(`https://github.com/${github.owner}/${github.repo}`);
            }

            function getGitHubOwnerUrl(github) {
                if (!github) {
                    return null;
                }

                return normalizeUrl(`https://github.com/${github.owner}`);
            }

            async function loadList() {
                const response = await fetch(
                    "https://api.github.com/repos/SrBananaMan/isitai-database/contents/list.json",
                    {
                        headers: {
                            Accept: "application/vnd.github.raw+json",
                        },

                        cache: "no-store",
                    }
                );

                if (!response.ok) {
                    throw new Error("Could not load confirmation list.");
                }

                return await response.json();
            }

            function normalizeEntries(entries) {
                return (entries || [])
                    .map((entry) => {
                        if (typeof entry === "string") {
                            const url = normalizeUrl(entry);

                            if (!url) {
                                return null;
                            }

                            return {
                                url,
                                short: [],
                                full: "",
                                state: "Confirmed",
                            };
                        }

                        if (!entry || typeof entry !== "object") {
                            return null;
                        }

                        const url = normalizeUrl(entry.url || "");

                        if (!url) {
                            return null;
                        }

                        const short = Array.isArray(entry.short)
                            ? entry.short.map((item) => String(item).trim()).filter(Boolean)
                            : entry.short
                              ? [String(entry.short).trim()]
                              : [];

                        return {
                            url,
                            short,
                            full: entry.full ? String(entry.full).trim() : "",
                            state: entry.state ? String(entry.state).trim() : "Confirmed",
                        };
                    })
                    .filter(Boolean);
            }

            function findEntry(entries, url) {
                return entries.find((entry) => entry.url === url) || null;
            }

            function normalizeUserList(entries) {
                return (entries || [])
                    .map((entry) => {
                        if (typeof entry === "string") {
                            const url = normalizeUrl(entry);

                            return url
                                ? {
                                      url,
                                      short: [],
                                      full: "",
                                      state: "Confirmed",
                                  }
                                : null;
                        }

                        if (!entry || typeof entry !== "object") {
                            return null;
                        }

                        const url = normalizeUrl(entry.url || "");

                        if (!url) {
                            return null;
                        }

                        const short = Array.isArray(entry.short)
                            ? entry.short.map((item) => String(item).trim()).filter(Boolean)
                            : entry.short
                              ? [String(entry.short).trim()]
                              : [];

                        return {
                            url,
                            short,
                            full: entry.full ? String(entry.full).trim() : "",
                            state: entry.state ? String(entry.state).trim() : "Confirmed",
                        };
                    })
                    .filter(Boolean);
            }

            function resetReviewForm() {
                reviewForm.classList.remove("visible");

                reviewProject.value = "";

                reviewUsername.value = "";

                reviewReason.value = "";

                reviewStatus.textContent = "";

                reviewStatus.className = "review-status";

                requestReviewButton.disabled = false;

                requestReviewButton.textContent = "Request Review";
            }

            function showReviewForm(url) {
                reviewProject.value = url;

                reviewForm.classList.add("visible");
            }

            function resetActions() {
                resultActions.classList.remove("visible");

                currentShareUrl = "";

                currentResultType = null;

                currentProjectUrl = "";

                shareButton.textContent = "Copy Share Link";

                classificationDetails.classList.remove("visible");
                classificationShortList.innerHTML = "";
                moreInfoButton.classList.remove("visible");
                currentClassificationInfo = null;
            }

            function showResult(type, answer, reason, url, info = null) {
                result.className = "result visible " + type;

                resultAnswer.textContent = answer;

                resultReason.textContent = reason;

                checkedUrl.textContent = url;

                resetReviewForm();

                resetActions();

                currentResultType = type;

                currentProjectUrl = url;

                currentClassificationInfo = info;

                if (info && info.short && info.short.length) {
                    classificationShortList.innerHTML = "";

                    for (const item of info.short) {
                        const li = document.createElement("li");
                        li.textContent = item;
                        classificationShortList.appendChild(li);
                    }

                    classificationDetails.classList.add("visible");
                }

                if (info && (info.full || info.state)) {
                    moreInfoButton.classList.add("visible");
                }

                if (type === "yes") {
                    currentShareUrl = `${window.location.origin}/isitai/vibecoded/?url=${encodeURIComponent(url)}`;

                    reportButton.textContent = "Report as Human Made";

                    resultActions.classList.add("visible");
                } else if (type === "no") {
                    currentShareUrl = `${window.location.origin}/isitai/human/?url=${encodeURIComponent(url)}`;

                    reportButton.textContent = "Report as Vibecoded";

                    resultActions.classList.add("visible");
                }
            }

            function openInfoModal() {
                if (!currentClassificationInfo) {
                    return;
                }

                const classification =
                    currentResultType === "yes"
                        ? "Vibecoded"
                        : currentResultType === "no"
                          ? "Human Made"
                          : "Unconfirmed";

                infoModalTitle.textContent =
                    classification === "Vibecoded"
                        ? "Why It's Classified as Vibecoded"
                        : classification === "Human Made"
                          ? "Why It's Classified as Human Made"
                          : "Project Information";

                infoModalDescription.textContent = currentProjectUrl;

                infoState.textContent = currentClassificationInfo.state || "Confirmed";

                infoFull.textContent =
                    currentClassificationInfo.full || "No additional information has been added for this project yet.";

                infoModal.classList.add("visible");
                document.body.classList.add("modal-open");
            }

            function closeInfoModal() {
                infoModal.classList.remove("visible");
                document.body.classList.remove("modal-open");
            }

            function openReportModal() {
                if (!currentProjectUrl || (currentResultType !== "yes" && currentResultType !== "no")) {
                    return;
                }

                const currentClassification = currentResultType === "yes" ? "Vibecoded" : "Human Made";

                const requestedClassification = currentResultType === "yes" ? "Human Made" : "Vibecoded";

                reportProject.value = currentProjectUrl;

                reportCurrent.value = currentClassification;

                reportRequested.value = requestedClassification;

                reportProjectDisplay.textContent = currentProjectUrl;

                reportModalTitle.textContent = `Report as ${requestedClassification}`;

                reportModalDescription.textContent = `The site currently classifies this repository as ${currentClassification}.`;

                submitReportButton.textContent = `Report as ${requestedClassification}`;

                reportUsername.value = "";

                reportReason.value = "";

                reportStatus.textContent = "";

                reportStatus.className = "report-status";

                submitReportButton.disabled = false;

                reportModal.classList.add("visible");

                document.body.classList.add("modal-open");

                setTimeout(() => {
                    reportUsername.focus();
                }, 50);
            }

            function closeReportModal() {
                reportModal.classList.remove("visible");

                document.body.classList.remove("modal-open");
            }

            async function checkUrl() {
                const originalValue = urlInput.value.trim();

                const normalized = normalizeUrl(originalValue);

                if (!normalized) {
                    status.className = "status error";

                    status.textContent = "Enter a valid URL.";

                    result.className = "result";

                    return;
                }

                const github = getGitHubRepository(normalized);

                if (!github) {
                    status.className = "status error";

                    status.textContent = "Enter a GitHub repository URL.";

                    result.className = "result";

                    return;
                }

                const comparisonUrl = getRepositoryUrl(github);

                const ownerUrl = getGitHubOwnerUrl(github);

                status.className = "status";

                status.textContent = "Checking...";

                result.className = "result";

                resetReviewForm();

                resetActions();

                checkButton.disabled = true;

                try {
                    const list = await loadList();

                    const vibecoded = normalizeEntries(list.vibecoded);

                    const human = normalizeEntries(list.human);

                    const vibecodedUsers = normalizeUserList(list.vibecoded_users);

                    const humanUsers = normalizeUserList(list.human_users);

                    const vibecodedEntry = findEntry(vibecoded, comparisonUrl);

                    if (vibecodedEntry) {
                        showResult(
                            "yes",
                            "Yes, It's Vibecoded",
                            "This repository has been manually confirmed as vibecoded.",
                            comparisonUrl,
                            vibecodedEntry
                        );

                        return;
                    }

                    const humanEntry = findEntry(human, comparisonUrl);

                    if (humanEntry) {
                        showResult(
                            "no",
                            "No, It's Human Made",
                            "This repository has been manually confirmed as human made.",
                            comparisonUrl,
                            humanEntry
                        );

                        return;
                    }

                    const vibecodedUserEntry = ownerUrl && findEntry(vibecodedUsers, ownerUrl);

                    if (vibecodedUserEntry) {
                        showResult(
                            "yes",
                            "Yes, It's Vibecoded",
                            "Repositories from this GitHub user or organization are classified as vibecoded.",
                            comparisonUrl,
                            vibecodedUserEntry
                        );

                        return;
                    }

                    const humanUserEntry = ownerUrl && findEntry(humanUsers, ownerUrl);

                    if (humanUserEntry) {
                        showResult(
                            "no",
                            "No, It's Human Made",
                            "Repositories from this GitHub user or organization are classified as human made.",
                            comparisonUrl,
                            humanUserEntry
                        );

                        return;
                    }

                    showResult(
                        "unknown",

                        "Not Confirmed Yet",

                        "This project has not been reviewed yet.",

                        comparisonUrl
                    );

                    showReviewForm(comparisonUrl);
                } catch (error) {
                    console.error(error);

                    status.className = "status error";

                    status.textContent = "Unable to complete the check.";

                    result.className = "result";
                } finally {
                    checkButton.disabled = false;

                    if (status.textContent === "Checking...") {
                        status.textContent = "";
                    }
                }
            }

            shareButton.addEventListener("click", async () => {
                if (!currentShareUrl) {
                    return;
                }

                try {
                    await navigator.clipboard.writeText(currentShareUrl);

                    shareButton.textContent = "Copied!";

                    setTimeout(() => {
                        shareButton.textContent = "Copy Share Link";
                    }, 1200);
                } catch {
                    shareButton.textContent = "Copy Failed";
                }
            });

            moreInfoButton.addEventListener("click", openInfoModal);

            infoModalClose.addEventListener("click", closeInfoModal);

            infoModal.addEventListener("click", (event) => {
                if (event.target === infoModal) {
                    closeInfoModal();
                }
            });

            reportButton.addEventListener("click", openReportModal);

            modalClose.addEventListener("click", closeReportModal);

            reportModal.addEventListener("click", (event) => {
                if (event.target === reportModal) {
                    closeReportModal();
                }
            });

            document.addEventListener("keydown", (event) => {
                if (event.key !== "Escape") {
                    return;
                }

                if (infoModal.classList.contains("visible")) {
                    closeInfoModal();
                }

                if (reportModal.classList.contains("visible")) {
                    closeReportModal();
                }
            });

            reviewForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                if (!reviewProject.value) {
                    return;
                }

                requestReviewButton.disabled = true;

                requestReviewButton.textContent = "Submitting...";

                reviewStatus.className = "review-status";

                reviewStatus.textContent = "";

                try {
                    const formData = new FormData(reviewForm);

                    const response = await fetch("https://formspree.io/f/mdengodg", {
                        method: "POST",

                        body: formData,

                        headers: {
                            Accept: "application/json",
                        },
                    });

                    if (!response.ok) {
                        throw new Error("Unable to submit review request.");
                    }

                    reviewStatus.className = "review-status success";

                    reviewStatus.textContent = "Review request submitted!";

                    requestReviewButton.textContent = "Submitted ✓";

                    reviewReason.value = "";
                } catch (error) {
                    console.error(error);

                    reviewStatus.className = "review-status error";

                    reviewStatus.textContent = "Unable to submit review request.";

                    requestReviewButton.disabled = false;

                    requestReviewButton.textContent = "Request Review";
                }
            });

            reportForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                submitReportButton.disabled = true;

                submitReportButton.textContent = "Submitting...";

                reportStatus.className = "report-status";

                reportStatus.textContent = "";

                try {
                    const formData = new FormData(reportForm);

                    const response = await fetch("https://formspree.io/f/mdengodg", {
                        method: "POST",

                        body: formData,

                        headers: {
                            Accept: "application/json",
                        },
                    });

                    if (!response.ok) {
                        throw new Error("Unable to submit report.");
                    }

                    reportStatus.className = "report-status success";

                    reportStatus.textContent = "Report submitted!";

                    submitReportButton.textContent = "Submitted ✓";

                    setTimeout(closeReportModal, 1300);
                } catch (error) {
                    console.error(error);

                    reportStatus.className = "report-status error";

                    reportStatus.textContent = "Unable to submit report.";

                    submitReportButton.disabled = false;

                    const requested = reportRequested.value || "Classification";

                    submitReportButton.textContent = `Report as ${requested}`;
                }
            });

            checkButton.addEventListener("click", checkUrl);

            urlInput.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    checkUrl();
                }
            });

            const query = new URLSearchParams(window.location.search);

            const queryUrl = query.get("url");

            if (queryUrl) {
                urlInput.value = queryUrl;

                checkUrl();
            }
        </script>
    </body>
</html>
