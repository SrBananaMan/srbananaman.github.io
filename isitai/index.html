<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Is It AI? - SrBananaMan</title>

        <meta name="description" content="Check whether a project has been confirmed as vibecoded." />

        <link rel="icon" type="image/png" href="/favicon.png" />

        <link rel="apple-touch-icon" href="/favicon.png" />

        <style>
            :root {
                --background: #090b12;
                --card: rgba(24, 29, 45, 0.82);

                --text: #ffffff;
                --text-secondary: #aeb6cc;

                --accent: #75d66f;
                --accent-hover: #93eb8e;

                --border: rgba(255, 255, 255, 0.1);

                --yes: #ff8181;
                --no: #75d66f;
                --unknown: #e8c66a;
                --error: #ff8080;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                min-height: 100vh;

                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;

                color: var(--text);

                background: radial-gradient(circle at top, rgba(65, 130, 75, 0.22), transparent 38%), var(--background);
            }

            a {
                color: inherit;
                text-decoration: none;
            }

            button,
            input,
            textarea {
                font: inherit;
            }

            header {
                width: min(1100px, calc(100% - 40px));
                margin: 0 auto;
                padding: 28px 0;

                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .logo {
                font-size: 1.2rem;
                font-weight: 800;
                letter-spacing: 0.03em;
            }

            .nav-links {
                display: flex;
                align-items: center;
                gap: 24px;
            }

            .nav-link {
                color: var(--text-secondary);
                font-weight: 600;

                transition: color 0.2s ease;
            }

            .nav-link:hover {
                color: var(--text);
            }

            main {
                width: min(800px, calc(100% - 40px));
                margin: 0 auto;
                padding: 80px 0 140px;
            }

            .page-heading {
                margin-bottom: 40px;
                text-align: center;
            }

            .page-heading h1 {
                font-size: clamp(3rem, 9vw, 6rem);

                letter-spacing: -0.06em;
            }

            .page-heading p {
                max-width: 620px;
                margin: 16px auto 0;

                color: var(--text-secondary);

                line-height: 1.7;
            }

            .checker-card {
                padding: clamp(28px, 5vw, 48px);

                border: 1px solid var(--border);

                border-radius: 26px;

                background: linear-gradient(135deg, rgba(94, 175, 91, 0.12), transparent 50%), var(--card);

                box-shadow: 0 30px 70px rgba(0, 0, 0, 0.28);
            }

            .input-row {
                display: flex;
                gap: 12px;
            }

            .url-input {
                flex: 1;
                min-width: 0;

                padding: 15px 17px;

                border: 1px solid var(--border);

                border-radius: 12px;

                outline: none;

                color: var(--text);

                background: rgba(255, 255, 255, 0.055);

                transition:
                    border-color 0.2s ease,
                    background 0.2s ease;
            }

            .url-input:focus {
                border-color: var(--accent);

                background: rgba(255, 255, 255, 0.075);
            }

            .check-button {
                padding: 15px 23px;

                border: 0;

                border-radius: 12px;

                color: #081008;

                background: var(--accent);

                font-weight: 900;

                cursor: pointer;

                transition:
                    background 0.2s ease,
                    transform 0.2s ease;
            }

            .check-button:hover {
                background: var(--accent-hover);

                transform: translateY(-2px);
            }

            .check-button:disabled {
                opacity: 0.6;

                cursor: wait;

                transform: none;
            }

            .status {
                min-height: 22px;

                margin-top: 15px;

                color: var(--text-secondary);

                text-align: center;

                font-size: 0.9rem;
            }

            .status.error {
                color: var(--error);
            }

            .result {
                display: none;

                margin-top: 28px;
                padding: 32px 24px;

                border: 1px solid var(--border);

                border-radius: 18px;

                text-align: center;

                background: rgba(0, 0, 0, 0.16);
            }

            .result.visible {
                display: block;
            }

            .result-answer {
                font-size: clamp(1.8rem, 5vw, 3rem);

                font-weight: 900;

                letter-spacing: -0.04em;
            }

            .result.yes .result-answer {
                color: var(--yes);
            }

            .result.no .result-answer {
                color: var(--no);
            }

            .result.unknown .result-answer {
                color: var(--unknown);
            }

            .result-reason {
                max-width: 580px;

                margin: 12px auto 0;

                color: var(--text-secondary);

                line-height: 1.6;
            }

            .checked-url {
                margin-top: 16px;

                color: var(--text-secondary);

                font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

                font-size: 0.8rem;

                overflow-wrap: anywhere;
            }

            .review-form {
                display: none;

                max-width: 520px;

                margin: 26px auto 0;

                padding-top: 24px;

                border-top: 1px solid var(--border);

                text-align: left;
            }

            .review-form.visible {
                display: block;
            }

            .review-heading {
                margin-bottom: 14px;

                text-align: center;

                font-size: 1rem;
                font-weight: 800;
            }

            .review-form label {
                display: block;

                margin-bottom: 8px;

                color: var(--text-secondary);

                font-size: 0.9rem;
                font-weight: 700;
            }

            .review-form textarea {
                width: 100%;

                min-height: 110px;

                padding: 14px 16px;

                border: 1px solid var(--border);

                border-radius: 11px;

                outline: none;

                resize: vertical;

                color: var(--text);

                background: rgba(255, 255, 255, 0.055);

                line-height: 1.5;

                transition:
                    border-color 0.2s ease,
                    background 0.2s ease;
            }

            .review-form textarea:focus {
                border-color: var(--accent);

                background: rgba(255, 255, 255, 0.075);
            }

            .request-review-button {
                width: 100%;

                margin-top: 12px;

                padding: 13px 20px;

                border: 0;

                border-radius: 11px;

                color: #081008;

                background: var(--accent);

                font-weight: 800;

                cursor: pointer;

                transition:
                    background 0.2s ease,
                    transform 0.2s ease;
            }

            .request-review-button:hover {
                background: var(--accent-hover);

                transform: translateY(-2px);
            }

            .request-review-button:disabled {
                opacity: 0.6;

                cursor: wait;

                transform: none;
            }

            .review-status {
                min-height: 22px;

                margin-top: 12px;

                color: var(--text-secondary);

                text-align: center;

                font-size: 0.86rem;
            }

            .review-status.success {
                color: var(--accent);
            }

            .review-status.error {
                color: var(--error);
            }

            .rule-note {
                margin-top: 26px;

                color: var(--text-secondary);

                font-size: 0.83rem;
                line-height: 1.6;

                text-align: center;
            }

            footer {
                border-top: 1px solid var(--border);

                background: rgba(0, 0, 0, 0.18);
            }

            .footer-content {
                width: min(1000px, calc(100% - 40px));

                margin: 0 auto;
                padding: 34px 0;

                color: var(--text-secondary);

                text-align: center;

                font-size: 0.92rem;
            }

            @media (max-width: 650px) {
                main {
                    padding-top: 50px;
                }

                .input-row {
                    flex-direction: column;
                }

                .check-button {
                    width: 100%;
                }
            }
        </style>
    </head>

    <body>
        <header>
            <a class="logo" href="/"> SrBananaMan </a>

            <nav class="nav-links">
                <a class="nav-link" href="/"> Home </a>

                <a class="nav-link" href="/tools/"> Tools </a>
            </nav>
        </header>

        <main>
            <div class="page-heading">
                <h1>Is It AI?</h1>

                <p>Enter a GitHub repository URL to check whether it has been confirmed as vibecoded.</p>
            </div>

            <div class="checker-card">
                <div class="input-row">
                    <input
                        class="url-input"
                        id="url-input"
                        type="url"
                        placeholder="https://github.com/owner/repository"
                        autocomplete="off"
                    />

                    <button class="check-button" id="check-button" type="button">Check</button>
                </div>

                <p class="status" id="status"></p>

                <div class="result" id="result">
                    <div class="result-answer" id="result-answer"></div>

                    <p class="result-reason" id="result-reason"></p>

                    <div class="checked-url" id="checked-url"></div>

                    <form class="review-form" id="review-form" action="https://formspree.io/f/mdengodg" method="POST">
                        <div class="review-heading">Request a Review</div>

                        <input type="hidden" id="review-project" name="Project URL" />

                        <input type="hidden" name="Source" value="SrBananaMan IsItAI" />

                        <label for="review-reason">
                            Why should this project be reviewed/Do you have an idea if it's AI or not?
                        </label>

                        <textarea
                            id="review-reason"
                            name="Reason"
                            placeholder="Optional evidence or information..."
                        ></textarea>

                        <button class="request-review-button" id="request-review-button" type="submit">
                            Request Review
                        </button>

                        <p class="review-status" id="review-status"></p>
                    </form>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-content">© 2026 SrBananaMan</div>
        </footer>

        <script>
            const urlInput = document.getElementById("url-input");

            const checkButton = document.getElementById("check-button");

            const status = document.getElementById("status");

            const result = document.getElementById("result");

            const resultAnswer = document.getElementById("result-answer");

            const resultReason = document.getElementById("result-reason");

            const checkedUrl = document.getElementById("checked-url");

            const reviewForm = document.getElementById("review-form");

            const reviewProject = document.getElementById("review-project");

            const reviewReason = document.getElementById("review-reason");

            const requestReviewButton = document.getElementById("request-review-button");

            const reviewStatus = document.getElementById("review-status");

            function normalizeUrl(value) {
                try {
                    const url = new URL(value.trim());

                    url.search = "";

                    url.hash = "";

                    let normalized = url.toString();

                    while (normalized.endsWith("/")) {
                        normalized = normalized.slice(0, -1);
                    }

                    if (url.hostname.toLowerCase() === "github.com") {
                        normalized = normalized.toLowerCase();
                    }

                    return normalized;
                } catch {
                    return null;
                }
            }

            function getGitHubRepository(value) {
                try {
                    const url = new URL(value);

                    if (url.hostname.toLowerCase() !== "github.com") {
                        return null;
                    }

                    const parts = url.pathname.split("/").filter(Boolean);

                    if (parts.length < 2) {
                        return null;
                    }

                    return {
                        owner: parts[0],

                        repo: parts[1].replace(/\.git$/i, ""),
                    };
                } catch {
                    return null;
                }
            }

            function getRepositoryUrl(github) {
                if (!github) {
                    return null;
                }

                return normalizeUrl(`https://github.com/${github.owner}/${github.repo}`);
            }

            function getGitHubOwnerUrl(github) {
                if (!github) {
                    return null;
                }

                return normalizeUrl(`https://github.com/${github.owner}`);
            }

            async function loadList() {
                const response = await fetch(
                    "https://raw.githubusercontent.com/SrBananaMan/isitai-database/main/list.json",
                    {
                        cache: "no-store",
                    }
                );

                if (!response.ok) {
                    throw new Error("Could not load confirmation list.");
                }

                return await response.json();
            }

            async function checkAIContributor(github) {
                if (!github) {
                    return null;
                }

                const repoBase = `https://api.github.com/repos/${github.owner}/${github.repo}`;

                try {
                    const contributorResponse = await fetch(`${repoBase}/contributors?per_page=100`, {
                        headers: {
                            Accept: "application/vnd.github+json",
                        },
                    });

                    if (contributorResponse.ok) {
                        const contributors = await contributorResponse.json();

                        for (const contributor of contributors) {
                            const login = (contributor.login || "").toLowerCase();

                            if (login.includes("claude") || login.includes("codex")) {
                                return {
                                    match: contributor.login,

                                    reason: "GitHub contributor",
                                };
                            }
                        }
                    }

                    const commitsResponse = await fetch(`${repoBase}/commits?per_page=100`, {
                        headers: {
                            Accept: "application/vnd.github+json",
                        },
                    });

                    if (commitsResponse.ok) {
                        const commits = await commitsResponse.json();

                        for (const commit of commits) {
                            const githubAuthor = (commit.author?.login || "").toLowerCase();

                            const githubCommitter = (commit.committer?.login || "").toLowerCase();

                            const authorName = (commit.commit?.author?.name || "").toLowerCase();

                            const committerName = (commit.commit?.committer?.name || "").toLowerCase();

                            const message = (commit.commit?.message || "").toLowerCase();

                            const fields = [
                                {
                                    value: githubAuthor,

                                    original: commit.author?.login,

                                    reason: "GitHub commit author",
                                },

                                {
                                    value: githubCommitter,

                                    original: commit.committer?.login,

                                    reason: "GitHub committer",
                                },

                                {
                                    value: authorName,

                                    original: commit.commit?.author?.name,

                                    reason: "commit author",
                                },

                                {
                                    value: committerName,

                                    original: commit.commit?.committer?.name,

                                    reason: "commit committer",
                                },
                            ];

                            for (const field of fields) {
                                if (field.value.includes("claude") || field.value.includes("codex")) {
                                    return {
                                        match: field.original,

                                        reason: field.reason,
                                    };
                                }
                            }

                            if (message.includes("claude") || message.includes("codex")) {
                                return {
                                    match: message.includes("claude") ? "Claude" : "Codex",

                                    reason: "commit message",
                                };
                            }
                        }
                    }

                    return null;
                } catch (error) {
                    console.error("AI contributor check failed:", error);

                    return null;
                }
            }
            function hideReviewForm() {
                reviewForm.classList.remove("visible");

                reviewProject.value = "";

                reviewReason.value = "";

                reviewStatus.textContent = "";

                reviewStatus.className = "review-status";

                requestReviewButton.disabled = false;

                requestReviewButton.textContent = "Request Review";
            }

            function showResult(type, answer, reason, url) {
                result.className = "result visible " + type;

                resultAnswer.textContent = answer;

                resultReason.textContent = reason;

                checkedUrl.textContent = url;

                hideReviewForm();
            }

            function showReviewForm(url) {
                reviewProject.value = url;

                reviewForm.classList.add("visible");
            }

            function normalizeList(entries) {
                return (entries || []).map(normalizeUrl).filter(Boolean);
            }

            async function checkUrl() {
                const originalValue = urlInput.value.trim();

                const normalized = normalizeUrl(originalValue);

                if (!normalized) {
                    status.className = "status error";

                    status.textContent = "Enter a valid URL.";

                    result.className = "result";

                    return;
                }

                const github = getGitHubRepository(normalized);

                if (!github) {
                    status.className = "status error";

                    status.textContent = "Enter a GitHub repository URL.";

                    result.className = "result";

                    return;
                }

                const comparisonUrl = getRepositoryUrl(github);

                const ownerUrl = getGitHubOwnerUrl(github);

                status.className = "status";

                status.textContent = "Checking...";

                result.className = "result";

                hideReviewForm();

                checkButton.disabled = true;

                try {
                    const [list, aiContributor] = await Promise.all([loadList(), checkAIContributor(github)]);

                    const vibecoded = normalizeList(list.vibecoded);

                    const human = normalizeList(list.human);

                    const vibecodedUsers = normalizeList(list.vibecoded_users);

                    const humanUsers = normalizeList(list.human_users);

                    if (vibecoded.includes(comparisonUrl)) {
                        showResult(
                            "yes",

                            "Yes, It's Vibecoded",

                            "This repository has been manually confirmed as vibecoded.",

                            comparisonUrl
                        );

                        return;
                    }

                    if (human.includes(comparisonUrl)) {
                        showResult(
                            "no",

                            "No, This Is Human Made",

                            "This repository has been manually confirmed as human made.",

                            comparisonUrl
                        );

                        return;
                    }

                    if (ownerUrl && vibecodedUsers.includes(ownerUrl)) {
                        showResult(
                            "yes",

                            "Yes, It's Vibecoded",

                            "Repositories from this user are classified as vibecoded.",

                            comparisonUrl
                        );

                        return;
                    }

                    if (ownerUrl && humanUsers.includes(ownerUrl)) {
                        showResult(
                            "no",

                            "No, This Is Human Made",

                            "Repositories from this user are classified as human made.",

                            comparisonUrl
                        );

                        return;
                    }

                    if (aiContributor) {
                        showResult(
                            "yes",

                            "Yes, It's Vibecoded",

                            `${aiContributor} was found in the GitHub contributor list.`,

                            comparisonUrl
                        );

                        return;
                    }

                    showResult(
                        "unknown",

                        "Not Confirmed Yet",

                        "This project has not been reviewed yet.",

                        comparisonUrl
                    );

                    showReviewForm(comparisonUrl);
                } catch (error) {
                    console.error(error);

                    status.className = "status error";

                    status.textContent = "Unable to complete the check.";

                    result.className = "result";
                } finally {
                    checkButton.disabled = false;

                    if (status.textContent === "Checking...") {
                        status.textContent = "";
                    }
                }
            }

            reviewForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                if (!reviewProject.value) {
                    return;
                }

                requestReviewButton.disabled = true;

                requestReviewButton.textContent = "Submitting...";

                reviewStatus.className = "review-status";

                reviewStatus.textContent = "";

                try {
                    const formData = new FormData(reviewForm);

                    const response = await fetch("https://formspree.io/f/mdengodg", {
                        method: "POST",

                        body: formData,

                        headers: {
                            Accept: "application/json",
                        },
                    });

                    if (!response.ok) {
                        throw new Error("Unable to submit review request.");
                    }

                    reviewStatus.className = "review-status success";

                    reviewStatus.textContent = "Review request submitted!";

                    requestReviewButton.textContent = "Submitted ✓";

                    reviewReason.value = "";
                } catch (error) {
                    console.error(error);

                    reviewStatus.className = "review-status error";

                    reviewStatus.textContent = "Unable to submit review request.";

                    requestReviewButton.disabled = false;

                    requestReviewButton.textContent = "Request Review";
                }
            });

            checkButton.addEventListener("click", checkUrl);

            urlInput.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    checkUrl();
                }
            });

            const query = new URLSearchParams(window.location.search);

            const queryUrl = query.get("url");

            if (queryUrl) {
                urlInput.value = queryUrl;

                checkUrl();
            }
        </script>
    </body>
</html>
