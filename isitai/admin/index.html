<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Is It AI? Admin</title>

        <style>
            :root {
                --background: #090b12;
                --card: rgba(24, 29, 45, 0.9);
                --text: #ffffff;
                --muted: #aeb6cc;
                --accent: #75d66f;
                --accent-hover: #93eb8e;
                --border: rgba(255, 255, 255, 0.1);
                --danger: #ff8181;
                --warning: #e8c66a;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: var(--text);
                background: radial-gradient(circle at top, rgba(65, 130, 75, 0.2), transparent 35%), var(--background);
            }

            button,
            input,
            textarea,
            select {
                font: inherit;
            }

            button {
                cursor: pointer;
            }

            .shell {
                width: min(1180px, calc(100% - 36px));
                margin: 0 auto;
                padding: 34px 0 80px;
            }

            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                margin-bottom: 28px;
            }

            .brand h1 {
                margin: 0;
                font-size: 1.55rem;
            }

            .brand p {
                margin: 5px 0 0;
                color: var(--muted);
            }

            .card {
                border: 1px solid var(--border);
                border-radius: 20px;
                background: var(--card);
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            }

            .login-card {
                width: min(440px, calc(100% - 36px));
                margin: 12vh auto 0;
                padding: 30px;
            }

            .login-card h1 {
                margin: 0 0 6px;
            }

            .login-card p {
                margin: 0 0 22px;
                color: var(--muted);
                line-height: 1.55;
            }

            .field {
                display: grid;
                gap: 7px;
                margin-bottom: 14px;
            }

            label {
                color: var(--muted);
                font-size: 0.88rem;
                font-weight: 750;
            }

            input,
            textarea,
            select {
                width: 100%;
                border: 1px solid var(--border);
                border-radius: 11px;
                outline: none;
                color: var(--text);
                background: rgba(255, 255, 255, 0.055);
            }

            input,
            select {
                height: 44px;
                padding: 0 13px;
            }

            textarea {
                min-height: 115px;
                padding: 12px 13px;
                resize: vertical;
                line-height: 1.5;
            }

            input:focus,
            textarea:focus,
            select:focus {
                border-color: var(--accent);
            }

            .primary,
            .secondary,
            .danger,
            .small-button {
                border: 0;
                border-radius: 10px;
                font-weight: 800;
            }

            .primary {
                padding: 11px 16px;
                color: #081008;
                background: var(--accent);
            }

            .primary:hover {
                background: var(--accent-hover);
            }

            .secondary {
                padding: 11px 16px;
                color: var(--text);
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid var(--border);
            }

            .danger {
                padding: 11px 16px;
                color: #170808;
                background: var(--danger);
            }

            .full {
                width: 100%;
            }

            .error {
                color: var(--danger);
            }

            .success {
                color: var(--accent);
            }

            .hidden {
                display: none !important;
            }

            .toolbar {
                display: grid;
                grid-template-columns: 1fr 180px auto;
                gap: 10px;
                margin-bottom: 16px;
            }

            .tabs {
                display: flex;
                gap: 8px;
                margin-bottom: 16px;
            }

            .tab {
                padding: 9px 13px;
                border: 1px solid var(--border);
                border-radius: 999px;
                color: var(--muted);
                background: rgba(255, 255, 255, 0.035);
                font-weight: 800;
            }

            .tab.active {
                color: #081008;
                background: var(--accent);
                border-color: transparent;
            }

            .table-card {
                overflow: hidden;
            }

            .table-wrap {
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 13px 14px;
                border-bottom: 1px solid var(--border);
                text-align: left;
                vertical-align: middle;
            }

            th {
                color: var(--muted);
                font-size: 0.78rem;
                letter-spacing: 0.04em;
                text-transform: uppercase;
            }

            td {
                font-size: 0.92rem;
            }

            tr:last-child td {
                border-bottom: 0;
            }

            .repo {
                max-width: 500px;
                overflow-wrap: anywhere;
            }

            .badge {
                display: inline-flex;
                padding: 5px 9px;
                border-radius: 999px;
                font-size: 0.78rem;
                font-weight: 850;
            }

            .badge.vibecoded {
                color: var(--danger);
                background: rgba(255, 129, 129, 0.09);
            }

            .badge.human {
                color: var(--accent);
                background: rgba(117, 214, 111, 0.09);
            }

            .row-actions {
                display: flex;
                gap: 7px;
            }

            .small-button {
                padding: 7px 10px;
                color: var(--text);
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid var(--border);
            }

            .small-button.delete {
                color: var(--danger);
            }

            .empty {
                padding: 50px 20px;
                color: var(--muted);
                text-align: center;
            }

            .modal-overlay {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                background: rgba(3, 5, 10, 0.82);
                backdrop-filter: blur(8px);
                z-index: 100;
            }

            .modal {
                width: min(650px, 100%);
                max-height: calc(100vh - 40px);
                overflow-y: auto;
                padding: 26px;
            }

            .modal-head {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 20px;
                margin-bottom: 20px;
            }

            .modal-head h2 {
                margin: 0;
            }

            .modal-head p {
                margin: 5px 0 0;
                color: var(--muted);
            }

            .close {
                width: 38px;
                height: 38px;
                border: 1px solid var(--border);
                border-radius: 10px;
                color: var(--text);
                background: rgba(255, 255, 255, 0.05);
                font-size: 1.3rem;
            }

            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .form-grid .wide {
                grid-column: 1 / -1;
            }

            .modal-actions {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                margin-top: 20px;
            }

            .right-actions {
                display: flex;
                gap: 10px;
            }

            .status {
                min-height: 20px;
                margin-top: 12px;
                color: var(--muted);
                font-size: 0.88rem;
            }

            @media (max-width: 720px) {
                .toolbar {
                    grid-template-columns: 1fr;
                }

                .topbar {
                    align-items: flex-start;
                    flex-direction: column;
                }

                .form-grid {
                    grid-template-columns: 1fr;
                }

                .form-grid .wide {
                    grid-column: auto;
                }

                .modal-actions {
                    flex-direction: column-reverse;
                }

                .right-actions {
                    flex-direction: column;
                }
            }
        </style>
    </head>

    <body>
        <section id="login-view" class="login-card card">
            <h1>Is It AI? Admin</h1>
            <p>Sign in to add, edit, search, and remove project classifications.</p>

            <form id="login-form">
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" required />
                </div>

                <button class="primary full" type="submit">Sign In</button>

                <div class="status" id="login-status"></div>
            </form>
        </section>

        <main id="app-view" class="shell hidden">
            <div class="topbar">
                <div class="brand">
                    <h1>Is It AI? Database</h1>
                    <p id="summary">Manage classifications.</p>
                </div>

                <div>
                    <button id="new-button" class="primary">+ Add Project</button>

                    <button id="logout-button" class="secondary">Sign Out</button>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="projects">Projects</button>

                <button class="tab" data-tab="owners">User / Org Rules</button>
            </div>

            <div class="toolbar">
                <input id="search" type="search" placeholder="Search repository..." />

                <select id="classification-filter">
                    <option value="">All classifications</option>
                    <option value="vibecoded">Vibecoded</option>
                    <option value="human">Human Made</option>
                </select>

                <button id="refresh-button" class="secondary">Refresh</button>
            </div>

            <section class="card table-card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th id="name-heading">Repository</th>
                                <th>Classification</th>
                                <th>State</th>
                                <th>Updated</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="rows"></tbody>
                    </table>
                </div>

                <div id="empty" class="empty hidden">No entries found.</div>
            </section>
        </main>

        <div id="editor-overlay" class="modal-overlay hidden">
            <section class="modal card">
                <div class="modal-head">
                    <div>
                        <h2 id="editor-title">Add Project</h2>
                        <p id="editor-subtitle">Add a classification to the database.</p>
                    </div>

                    <button id="editor-close" class="close" type="button">×</button>
                </div>

                <form id="editor-form">
                    <div class="form-grid">
                        <div class="field wide">
                            <label for="entry-url" id="url-label"> GitHub Repository URL </label>

                            <input id="entry-url" type="url" required />
                        </div>

                        <div class="field">
                            <label for="entry-classification"> Classification </label>

                            <select id="entry-classification" required>
                                <option value="vibecoded">Vibecoded</option>
                                <option value="human">Human Made</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="entry-state"> State </label>

                            <input id="entry-state" type="text" value="Active" placeholder="Active" />
                        </div>

                        <div class="field wide">
                            <label for="entry-short"> Short Reasons </label>

                            <textarea id="entry-short" placeholder="One bullet point per line"></textarea>
                        </div>

                        <div class="field wide">
                            <label for="entry-full"> Full Description </label>

                            <textarea
                                id="entry-full"
                                style="min-height: 190px"
                                placeholder="Full explanation and current state of the project..."
                            ></textarea>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button id="delete-button" class="danger hidden" type="button">Delete</button>

                        <div class="right-actions">
                            <button id="cancel-button" class="secondary" type="button">Cancel</button>

                            <button id="save-button" class="primary" type="submit">Save</button>
                        </div>
                    </div>

                    <div id="editor-status" class="status"></div>
                </form>
            </section>
        </div>

        <script>
            const API_BASE = "https://isitai-api.isitai-api.workers.dev";

            const loginView = document.getElementById("login-view");

            const appView = document.getElementById("app-view");

            const loginForm = document.getElementById("login-form");

            const password = document.getElementById("password");

            const loginStatus = document.getElementById("login-status");

            const rows = document.getElementById("rows");

            const empty = document.getElementById("empty");

            const search = document.getElementById("search");

            const classificationFilter = document.getElementById("classification-filter");

            const newButton = document.getElementById("new-button");

            const logoutButton = document.getElementById("logout-button");

            const refreshButton = document.getElementById("refresh-button");

            const nameHeading = document.getElementById("name-heading");

            const editorOverlay = document.getElementById("editor-overlay");

            const editorForm = document.getElementById("editor-form");

            const editorTitle = document.getElementById("editor-title");

            const editorSubtitle = document.getElementById("editor-subtitle");

            const editorClose = document.getElementById("editor-close");

            const cancelButton = document.getElementById("cancel-button");

            const deleteButton = document.getElementById("delete-button");

            const saveButton = document.getElementById("save-button");

            const editorStatus = document.getElementById("editor-status");

            const entryUrl = document.getElementById("entry-url");

            const urlLabel = document.getElementById("url-label");

            const entryClassification = document.getElementById("entry-classification");

            const entryState = document.getElementById("entry-state");

            const entryShort = document.getElementById("entry-short");

            const entryFull = document.getElementById("entry-full");

            let activeTab = "projects";
            let currentItems = [];
            let editing = null;
            let searchTimer = null;

            async function api(path, options = {}) {
                const response = await fetch(API_BASE + path, {
                    ...options,
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json",
                        ...(options.headers || {}),
                    },
                });

                let body = {};

                try {
                    body = await response.json();
                } catch {}

                if (response.status === 401) {
                    showLogin();
                    throw new Error(body.error || "Please sign in.");
                }

                if (!response.ok) {
                    throw new Error(body.error || "Request failed.");
                }

                return body;
            }

            function showLogin() {
                appView.classList.add("hidden");
                loginView.classList.remove("hidden");
            }

            function showApp() {
                loginView.classList.add("hidden");
                appView.classList.remove("hidden");
            }

            async function checkSession() {
                try {
                    await api("/api/admin/me");
                    showApp();
                    await loadEntries();
                } catch {
                    showLogin();
                }
            }

            loginForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                loginStatus.textContent = "Signing in...";

                try {
                    await api("/api/admin/login", {
                        method: "POST",
                        body: JSON.stringify({
                            password: password.value,
                        }),
                    });

                    password.value = "";
                    loginStatus.textContent = "";

                    showApp();
                    await loadEntries();
                } catch (error) {
                    loginStatus.className = "status error";

                    loginStatus.textContent = error.message;
                }
            });

            logoutButton.addEventListener("click", async () => {
                try {
                    await api("/api/admin/logout", {
                        method: "POST",
                        body: "{}",
                    });
                } finally {
                    showLogin();
                }
            });

            async function loadEntries() {
                rows.innerHTML = "";

                const q = encodeURIComponent(search.value.trim());

                let path;

                if (activeTab === "projects") {
                    const classification = encodeURIComponent(classificationFilter.value);

                    path = `/api/admin/projects?q=${q}&classification=${classification}&limit=200`;
                } else {
                    path = `/api/admin/owners?q=${q}`;
                }

                const data = await api(path);

                currentItems = data.items || [];

                renderRows();
            }

            function renderRows() {
                rows.innerHTML = "";

                let items = currentItems;

                if (activeTab === "owners" && classificationFilter.value) {
                    items = items.filter((item) => item.classification === classificationFilter.value);
                }

                empty.classList.toggle("hidden", items.length > 0);

                for (const item of items) {
                    const tr = document.createElement("tr");

                    const name = document.createElement("td");

                    name.className = "repo";

                    name.textContent = item.url;

                    const classification = document.createElement("td");

                    const badge = document.createElement("span");

                    badge.className = `badge ${item.classification}`;

                    badge.textContent = item.classification === "vibecoded" ? "Vibecoded" : "Human Made";

                    classification.appendChild(badge);

                    const state = document.createElement("td");

                    state.textContent = item.state || "Active";

                    const updated = document.createElement("td");

                    updated.textContent = item.updated_at || "";

                    const actions = document.createElement("td");

                    const wrap = document.createElement("div");

                    wrap.className = "row-actions";

                    const edit = document.createElement("button");

                    edit.className = "small-button";

                    edit.textContent = "Edit";

                    edit.addEventListener("click", () => openEditor(item));

                    wrap.appendChild(edit);
                    actions.appendChild(wrap);

                    tr.append(name, classification, state, updated, actions);

                    rows.appendChild(tr);
                }
            }

            function openEditor(item = null) {
                editing = item;

                const isOwner = activeTab === "owners";

                editorTitle.textContent = item
                    ? isOwner
                        ? "Edit User / Org Rule"
                        : "Edit Project"
                    : isOwner
                      ? "Add User / Org Rule"
                      : "Add Project";

                editorSubtitle.textContent = isOwner
                    ? "This rule applies to repositories owned by this GitHub user or organization unless an exact project entry exists."
                    : "Exact project entries take priority over user / organization rules.";

                urlLabel.textContent = isOwner ? "GitHub User / Organization URL" : "GitHub Repository URL";

                entryUrl.placeholder = isOwner
                    ? "https://github.com/HarbourMasters"
                    : "https://github.com/owner/repository";

                entryUrl.value = item?.url || "";

                entryClassification.value = item?.classification || "vibecoded";

                entryState.value = item?.state || "Active";

                entryShort.value = (item?.short || []).join("\n");

                entryFull.value = item?.full || "";

                editorStatus.textContent = "";

                deleteButton.classList.toggle("hidden", !item);

                editorOverlay.classList.remove("hidden");

                entryUrl.focus();
            }

            function closeEditor() {
                editorOverlay.classList.add("hidden");

                editing = null;
            }

            editorForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                const isOwner = activeTab === "owners";

                const base = isOwner ? "/api/admin/owners" : "/api/admin/projects";

                const path = editing ? `${base}/${editing.id}` : base;

                const method = editing ? "PUT" : "POST";

                saveButton.disabled = true;

                editorStatus.textContent = "Saving...";

                try {
                    await api(path, {
                        method,
                        body: JSON.stringify({
                            url: entryUrl.value,
                            classification: entryClassification.value,
                            state: entryState.value,
                            short: entryShort.value
                                .split("\n")
                                .map((line) => line.trim())
                                .filter(Boolean),
                            full: entryFull.value,
                        }),
                    });

                    closeEditor();
                    await loadEntries();
                } catch (error) {
                    editorStatus.className = "status error";

                    editorStatus.textContent = error.message;
                } finally {
                    saveButton.disabled = false;
                }
            });

            deleteButton.addEventListener("click", async () => {
                if (!editing) {
                    return;
                }

                const label = activeTab === "owners" ? "this user / organization rule" : "this project";

                if (!confirm(`Delete ${label}? This cannot be undone.`)) {
                    return;
                }

                const base = activeTab === "owners" ? "/api/admin/owners" : "/api/admin/projects";

                try {
                    await api(`${base}/${editing.id}`, {
                        method: "DELETE",
                    });

                    closeEditor();
                    await loadEntries();
                } catch (error) {
                    editorStatus.className = "status error";

                    editorStatus.textContent = error.message;
                }
            });

            newButton.addEventListener("click", () => openEditor());

            editorClose.addEventListener("click", closeEditor);

            cancelButton.addEventListener("click", closeEditor);

            editorOverlay.addEventListener("click", (event) => {
                if (event.target === editorOverlay) {
                    closeEditor();
                }
            });

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && !editorOverlay.classList.contains("hidden")) {
                    closeEditor();
                }
            });

            document.querySelectorAll(".tab").forEach((tab) => {
                tab.addEventListener("click", async () => {
                    activeTab = tab.dataset.tab;

                    document
                        .querySelectorAll(".tab")
                        .forEach((other) => other.classList.toggle("active", other === tab));

                    nameHeading.textContent = activeTab === "projects" ? "Repository" : "User / Organization";

                    search.placeholder =
                        activeTab === "projects" ? "Search repository..." : "Search user or organization...";

                    newButton.textContent = activeTab === "projects" ? "+ Add Project" : "+ Add Rule";

                    await loadEntries();
                });
            });

            search.addEventListener("input", () => {
                clearTimeout(searchTimer);

                searchTimer = setTimeout(loadEntries, 250);
            });

            classificationFilter.addEventListener("change", loadEntries);

            refreshButton.addEventListener("click", loadEntries);

            checkSession();
        </script>
    </body>
</html>
